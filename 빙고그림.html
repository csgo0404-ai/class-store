<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>빙고 그림 그리기</title>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Nanum+Pen+Script&family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Single+Day&family=Jua&family=Sunflower:wght@500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:linear-gradient(135deg,#E6F1FB 0%,#FBEAF0 100%); }
body { display:flex; flex-direction:column; }

/* ── 타이틀 ── */
#titleBar { display:none; }

/* ── 메인 레이아웃 ── */
#mainWrap { flex:1; display:flex; flex-direction:column; min-height:0; padding:6px; gap:6px; }

.cover-main-row {
    display:grid;
    grid-template-columns:auto auto auto;
    grid-template-rows:auto auto;
    gap:6px 8px;
    justify-content:center;
    flex:1; min-height:0;
}

/* ── 좌측 툴바 ── */
.cover-side-tools {
    display:flex; flex-direction:column; gap:4px;
    background:white; padding:6px 8px; border-radius:10px;
    flex-shrink:0; align-self:flex-start;
}
.cover-side-tools .cover-tool-btn { width:100%; text-align:left; }
.cover-side-tools .sticker-popover { top:0; left:100%; margin-top:0; margin-left:4px; }

/* ── 우측 툴바 ── */
.cover-right-tools {
    display:flex; flex-direction:column; gap:4px;
    background:white; padding:6px 8px; border-radius:10px;
    flex-shrink:0; align-self:flex-start;
}
.cover-right-tools .sticker-popover { top:0; right:100%; left:auto; margin-top:0; margin-right:4px; }
.cover-right-tools .color-dot { flex-shrink:0; }
.cover-right-divider { border:none; border-top:1px solid #eee; margin:2px 0; }

/* ── 공통 도구 버튼 ── */
.cover-tool-btn {
    padding:5px 10px; border-radius:8px;
    border:2px solid #ddd; background:white;
    font-size:13px; cursor:pointer; transition:0.15s;
    min-width:unset; flex:0 0 auto; white-space:nowrap;
}
.cover-tool-btn:hover { border-color:#aaa; }
.cover-tool-btn.active {
    background:linear-gradient(135deg,#FFCA28,#F9A825);
    color:white; border-color:#F9A825;
}

/* ── 색상 점 ── */
.color-dot {
    width:24px; height:24px; border-radius:50%;
    cursor:pointer; border:3px solid transparent;
    transition:0.15s; flex-shrink:0;
}
.color-dot.active { border-color:#333; transform:scale(1.15); }

/* ── 최근 색상 ── */
.recent-color-dot {
    width:24px; height:24px; border-radius:50%;
    cursor:pointer; border:2px dashed #ccc;
    transition:0.15s; flex-shrink:0;
}
.recent-color-dot.has-color { border-style:solid; border-color:#aaa; }

/* ── 커스텀 컬러 ── */
.color-picker-btn {
    position:relative; display:inline-flex; align-items:center;
    font-size:22px; cursor:pointer; flex-shrink:0; padding:0 4px;
}
.color-picker-btn:hover { transform:scale(1.15); }
#coverCustomColor { position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }

/* ── 스티커 팝오버 ── */
.sticker-popover {
    position:absolute; top:100%; left:0; margin-top:6px;
    background:white; border:2px solid #FFC1D9;
    border-radius:12px; padding:10px; box-shadow:0 4px 14px rgba(0,0,0,0.15);
    display:none; z-index:100; width:280px;
}
.sticker-popover.show { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.sticker-popover .sticker-item {
    display:flex; align-items:center; justify-content:center;
    font-size:28px; padding:6px;
    cursor:pointer; border-radius:6px;
}
.sticker-popover .sticker-item:hover { background:#FFF6E5; }
.sticker-popover .sticker-item.active { background:#FFE5B4; box-shadow:0 0 0 2px #EF9F27; }

/* 세로 팝오버 (연필/도형/대칭 등) */
.sticker-popover.v-pop { width:auto; min-width:90px; }
.sticker-popover.v-pop.show { grid-template-columns:1fr !important; }
.sticker-popover.v-pop .sticker-item { font-size:14px; display:block; }

/* ── 캔버스 래퍼 ── */
.cover-canvas-wrap {
    position:relative; overflow:hidden;
    touch-action:none;
    width:min(calc(100svh - 160px), calc(100vw - 210px));
    aspect-ratio:1/1;
    flex-shrink:0;
    background:white; border-radius:0; font-size:0; line-height:0;
    box-shadow:0 0 0 2px #FFD6E0;
}
#coverCanvas, #coverPreviewCanvas, #coverTopCanvas {
    display:block; position:absolute; inset:0;
    width:100%; height:100%;
    touch-action:none; cursor:crosshair;
    transform-origin:0 0;
}
#coverCanvas { background:transparent; z-index:1; pointer-events:none; }
#coverPreviewCanvas { pointer-events:none; background:transparent; z-index:2; }
#coverTopCanvas { background:transparent; z-index:3; }
#coverGridOverlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none; background-image:linear-gradient(#7F77DD22 1px,transparent 1px),linear-gradient(90deg,#7F77DD22 1px,transparent 1px); background-size:5% 5%; }

/* ── 텍스트 color swatch ── */
.text-color-swatch[data-off="1"] .swatch-x { background:linear-gradient(to top right,transparent calc(50% - 1.5px),#888 calc(50% - 1.5px),#888 calc(50% + 1.5px),transparent calc(50% + 1.5px)); border-radius:50%; }
.text-color-swatch[data-off="1"] { background:white !important; }

/* ── 우측 상단 X버튼 ── */
#topBtns { position:fixed; top:6px; right:8px; display:flex; gap:6px; z-index:200; }
#btnCancel { border:none; border-radius:8px; cursor:pointer; font-family:inherit; font-size:12px; padding:5px 10px; background:transparent; color:#aaa; }
#btnSubmit:disabled { opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>

<div id="titleBar"></div>
<div id="topBtns">
  <button id="btnCancel" onclick="doCancel()">✕</button>
</div>

<div id="mainWrap">
  <div class="cover-main-row">

    <!-- ── 좌측 툴바 ── -->
    <div class="cover-side-tools" style="grid-column:1;grid-row:2;">
      <div style="position:relative;">
        <button class="cover-tool-btn active" id="coverPencilBtn" onclick="togglePencilPopover()" title="연필">✏️ <span id="coverPencilLabel">연필</span></button>
        <div class="sticker-popover v-pop" id="coverPencilPopover">
          <span class="sticker-item" data-style="round" onclick="selectBrushStyle('round','연필')">연필</span>
          <span class="sticker-item" data-style="pastel" onclick="selectBrushStyle('pastel','파스텔')">파스텔</span>
          <span class="sticker-item" data-style="spray" onclick="selectBrushStyle('spray','스프레이')">스프레이</span>
          <span class="sticker-item" data-style="crayon" onclick="selectBrushStyle('crayon','크레용')">크레용</span>
        </div>
      </div>
      <button class="cover-tool-btn" id="coverEraserBtn" onclick="setCoverTool('eraser')" title="지우개">🧽 지우개</button>
      <button class="cover-tool-btn" id="coverBucketBtn" onclick="setCoverTool('bucket')" title="채우기">🖌 채우기</button>
      <button class="cover-tool-btn" id="coverTextBtn" onclick="openTextEditorAtButton()" title="글자">🅰️ 글자</button>
      <button class="cover-tool-btn" id="coverSelectBtn" onclick="setCoverTool('select')" title="선택">👆 선택</button>
      <div style="position:relative;">
        <button class="cover-tool-btn" id="coverSymBtn" onclick="toggleSymPopover()" title="대칭">🪞 대칭</button>
        <div class="sticker-popover v-pop" id="coverSymPopover">
          <span class="sticker-item" onclick="setSymmetry('h','좌우')">좌우</span>
          <span class="sticker-item" onclick="setSymmetry('v','상하')">상하</span>
          <span class="sticker-item" onclick="setSymmetry('4','4방향')">4방향</span>
          <span class="sticker-item" onclick="setSymmetry('none','끔')">끄기</span>
        </div>
      </div>
      <button class="cover-tool-btn" id="coverGridBtn" onclick="toggleGrid()" title="그리드">⊞ 그리드</button>
      <div style="position:relative;">
        <button class="cover-tool-btn" id="coverShapeBtn" onclick="toggleShapePopover()" title="도형">📐 도형</button>
        <div class="sticker-popover v-pop" id="coverShapePopover">
          <span class="sticker-item" data-tool="line" onclick="selectShape('line')">직선</span>
          <span class="sticker-item" data-tool="circle" onclick="selectShape('circle')">원</span>
          <span class="sticker-item" data-tool="rect" onclick="selectShape('rect')">사각형</span>
        </div>
      </div>
      <div style="position:relative;">
        <button class="cover-tool-btn" id="coverStickerBtn" onclick="toggleStickerPopover()" title="스티커">🏷️ 스티커</button>
        <div class="sticker-popover" id="coverStickerPopover"></div>
      </div>
      <button class="cover-tool-btn" onclick="document.getElementById('coverImageInput').click()" title="이미지 삽입">🖼️ 이미지</button>
      <input type="file" id="coverImageInput" accept="image/*" style="display:none" onchange="handleImageInsert(this)">
    </div>

    <!-- ── 상단바 ── -->
    <div style="grid-column:2;grid-row:1;display:flex;justify-content:flex-end;align-items:center;">
      <div style="display:inline-flex;align-items:center;gap:6px;background:white;padding:5px 8px;border-radius:10px;flex-wrap:nowrap;">
        <span style="font-size:11px;color:#aaa;white-space:nowrap;">굵기</span>
        <input type="range" id="coverBrushSize" min="1" max="40" value="4" style="width:70px;flex-shrink:0;" title="굵기">
        <span style="font-size:11px;color:#aaa;white-space:nowrap;">줌</span>
        <input type="range" id="coverZoomSlider" min="100" max="400" value="100" style="width:70px;flex-shrink:0;" oninput="setCoverZoomPercent(this.value)" title="줌">
        <span id="coverZoomLabel" style="font-size:11px;color:#888;min-width:30px;white-space:nowrap;">100%</span>
        <button class="cover-tool-btn" id="coverPanBtn" onclick="setCoverTool('pan')" title="이동">🖐</button>
        <button class="cover-tool-btn" onclick="undoCover()" title="실행 취소">↶</button>
        <button class="cover-tool-btn" onclick="redoCover()" title="다시 실행">↷</button>
        <button class="cover-tool-btn" onclick="clearCover()" title="전체 지우기">🗑️</button>
        <button id="btnSubmit" class="cover-tool-btn" onclick="doSubmit()" title="제출하기">📤</button>
      </div>
    </div>

    <!-- ── 캔버스 ── -->
    <div class="cover-canvas-wrap" id="coverCanvasWrap" style="grid-column:2;grid-row:2;">
      <canvas id="coverCanvas" width="1200" height="1200"></canvas>
      <canvas id="coverPreviewCanvas" width="1200" height="1200"></canvas>
      <canvas id="coverTopCanvas" width="1200" height="1200"></canvas>
      <div id="coverGridOverlay"></div>
    </div>

    <!-- ── 우측 툴바 ── -->
    <div class="cover-right-tools" style="grid-column:3;grid-row:2;">
      <div class="color-dot active" style="background:#333" data-color="#333" onclick="setCoverColor('#333',this)"></div>
      <div class="color-dot" style="background:#FF5252" data-color="#FF5252" onclick="setCoverColor('#FF5252',this)"></div>
      <div class="color-dot" style="background:#FF9800" data-color="#FF9800" onclick="setCoverColor('#FF9800',this)"></div>
      <div class="color-dot" style="background:#FFD740" data-color="#FFD740" onclick="setCoverColor('#FFD740',this)"></div>
      <div class="color-dot" style="background:#4CAF50" data-color="#4CAF50" onclick="setCoverColor('#4CAF50',this)"></div>
      <div class="color-dot" style="background:#2196F3" data-color="#2196F3" onclick="setCoverColor('#2196F3',this)"></div>
      <div class="color-dot" style="background:#9C27B0" data-color="#9C27B0" onclick="setCoverColor('#9C27B0',this)"></div>
      <div class="color-dot" style="background:#795548" data-color="#795548" onclick="setCoverColor('#795548',this)"></div>
      <hr class="cover-right-divider">
      <div id="coverRecentColors" style="display:flex;flex-direction:column;gap:4px;"></div>
      <hr class="cover-right-divider">
      <label class="color-picker-btn" title="직접 색 선택" style="display:flex;justify-content:center;line-height:1;cursor:pointer;">🎨<input type="color" id="coverCustomColor" value="#333333" oninput="setCoverColor(this.value)"></label>
      <span id="coverEyedropperBtn" onclick="setCoverTool('eyedropper')" title="스포이드" style="display:flex;justify-content:center;font-size:20px;cursor:pointer;">💧</span>
    </div>

  </div>
</div>


<!-- ── 인라인 텍스트 편집 ── -->
<div id="coverTextEditor" style="display:none;position:fixed;z-index:10050;background:white;border:2px solid #7F77DD;border-radius:10px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,0.2);min-width:340px;">
  <textarea id="coverTextEditorInput" placeholder="텍스트 입력" rows="3" style="width:100%;border:1.5px solid #D3D1C7;outline:none;font-size:24px;padding:8px;border-radius:8px;resize:vertical;box-sizing:border-box;text-align:center;"></textarea>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#5F5E5A;">
    <select id="coverTextEditorFont" style="font-size:12px;padding:3px 6px;" onchange="applyTextEditorPreview()">
      <option value="Dongle">Dongle</option>
      <option value="Nanum Pen Script">손글씨</option>
      <option value="Black Han Sans">굵은</option>
      <option value="Gaegu">개구</option>
      <option value="Single Day">필기</option>
      <option value="Jua">주아</option>
      <option value="Sunflower">선플라워</option>
    </select>
    <input type="hidden" id="coverTextEditorSize" value="60">
    <label style="display:inline-flex;align-items:center;gap:3px;">글씨
      <input type="color" id="coverTextEditorColor" value="#333333" style="width:28px;height:24px;border:1px solid #ccc;border-radius:4px;padding:0;" oninput="applyTextEditorPreview()">
    </label>
    <span style="display:inline-flex;align-items:center;gap:4px;">그림자
      <span class="text-color-swatch" id="coverShadowSwatch" data-off="1" onclick="toggleColorSwatch('shadow',event)" oncontextmenu="event.preventDefault();offColorSwatch('shadow');applyTextEditorPreview();" style="position:relative;display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #ccc;background:#ddd;cursor:pointer;"><span class="swatch-x" style="position:absolute;inset:0;pointer-events:none;"></span></span>
    </span>
    <input type="hidden" id="coverTextEditorShadow" value="#000000">
    <span style="display:inline-flex;align-items:center;gap:4px;">음영
      <span class="text-color-swatch" id="coverBgSwatch" data-off="1" onclick="toggleColorSwatch('bg',event)" oncontextmenu="event.preventDefault();offColorSwatch('bg');applyTextEditorPreview();" style="position:relative;display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #ccc;background:#ddd;cursor:pointer;"><span class="swatch-x" style="position:absolute;inset:0;pointer-events:none;"></span></span>
    </span>
    <input type="hidden" id="coverTextEditorBg" value="#FFD740">
  </div>
  <div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end;">
    <button onclick="closeInlineText()" style="padding:5px 12px;font-size:13px;background:#fff;border:1.5px solid #ccc;border-radius:6px;cursor:pointer;min-width:unset;">취소</button>
    <button onclick="commitInlineTextFromButton()" style="padding:5px 12px;font-size:13px;background:linear-gradient(135deg,#7F77DD,#D4537E);color:white;border:none;border-radius:6px;cursor:pointer;min-width:unset;">✓ 확인</button>
  </div>
</div>

<script>
/* ── Cloudinary ── */
const CLOUDINARY_CLOUD = 'dtzknm7gz';
const CLOUDINARY_PRESET = 'csgo0404';

/* ── 스티커 세트 ── */
const STICKER_SET = ['⭐','🌸','🌈','🌟','🎈','🎀','🌙','☀️','🍀','🐰','🐱','🐶','🦄','💖','🌺','🍎','🦋','🐢','🍓','🍰'];

/* ── 드래프트 자동저장 키 ── */
let _bingoDraftKey = null;

/* ── 상태 변수 (동화책 제작과 동일한 이름) ── */
let _coverCanvas = null, _coverCtx = null;
let _coverBase = null, _coverBaseCtx = null;
let _coverPreview = null, _coverPreviewCtx = null;
let _coverWrap = null;
let _coverDrawing = false;
let _coverTool = 'pencil';
let _coverColor = '#333';
let _coverRecent = [];
let _coverHistory = [], _coverHistIdx = -1;
let _coverShapeStart = null;
let _coverCurrentSticker = '⭐';
let _coverZoom = 1, _coverPanX = 0, _coverPanY = 0;
let _pinchDist = 0, _pinchCenter = null, _panStart = null;
let _coverStickers = [];
let _selectedStickerIdx = -1;
let _stickerDragMode = null, _stickerDragOffset = null;
let _coverSymmetry = 'none';
let _coverGridOn = false;
let _pendingTextPos = null;
let _lastDrawPoint = null;
let _brushStyle = 'round';
let _editingTextIdx = -1;
let _imageCache = {};
let _selectMarquee = null;
let _moveStroke = null, _moveBg = null, _moveStart = null;

/* ── 초기화 ── */
function initCoverCanvas() {
    _coverBase = document.getElementById('coverCanvas');
    _coverBaseCtx = _coverBase.getContext('2d', { willReadFrequently:true });
    _coverCanvas = document.getElementById('coverTopCanvas');
    _coverCtx = _coverCanvas.getContext('2d', { willReadFrequently:true });
    _coverPreview = document.getElementById('coverPreviewCanvas');
    _coverPreviewCtx = _coverPreview.getContext('2d');
    _coverWrap = document.getElementById('coverCanvasWrap');

    syncWrapToInteger();
    if (!window._coverWrapResizeBound) {
        window.addEventListener('resize', syncWrapToInteger);
        if (typeof ResizeObserver !== 'undefined' && _coverWrap.parentElement) {
            try { const ro = new ResizeObserver(()=>syncWrapToInteger()); ro.observe(_coverWrap.parentElement); } catch(e){}
        }
        window._coverWrapResizeBound = true;
    }
    clearCoverNoSave();
    _coverCtx.lineCap = 'round'; _coverCtx.lineJoin = 'round';
    saveCoverState();
    loadRecentColors(); renderRecentColors();
    initStickerPopover();

    const applyTransform = () => {
        const t = `translate(${_coverPanX}px,${_coverPanY}px) scale(${_coverZoom})`;
        _coverBase.style.transform = t;
        _coverCanvas.style.transform = t;
        _coverPreview.style.transform = t;
    };
    window._coverApplyTransform = applyTransform;

    const getPos = (clientX, clientY) => {
        const r = _coverCanvas.getBoundingClientRect();
        return { x:(clientX-r.left)*(_coverCanvas.width/r.width), y:(clientY-r.top)*(_coverCanvas.height/r.height) };
    };
    const getSize = () => parseInt(document.getElementById('coverBrushSize').value)||4;

    const startDraw = (cx, cy) => {
        if (_coverTool === 'pan') { _panStart={panX:_coverPanX,panY:_coverPanY,px:cx,py:cy}; updateCoverCursor(); return; }
        const p = getPos(cx, cy);
        if (_coverTool === 'sticker' || _coverTool === 'select') {
            const hit = hitTestSticker(p.x, p.y);
            if (hit.handle === 'delete') { _coverStickers.splice(hit.idx,1); _selectedStickerIdx=-1; renderStickerLayer(); saveCoverState(); return; }
            if (hit.idx >= 0) {
                _selectedStickerIdx = hit.idx; _stickerDragMode = hit.handle||'move';
                const s = _coverStickers[hit.idx];
                _stickerDragOffset = { dx:p.x-s.x, dy:p.y-s.y, startSize:s.size, startDist:Math.hypot(p.x-s.x,p.y-s.y), startRot:s.rotation||0, startAngle:Math.atan2(p.y-s.y,p.x-s.x) };
            } else if (_coverTool === 'sticker') {
                const size = getSize()*4+30;
                bakeTopToBase();
                _coverStickers.push({emoji:_coverCurrentSticker,x:p.x,y:p.y,size});
                _selectedStickerIdx = _coverStickers.length-1; _stickerDragMode='move'; _stickerDragOffset={dx:0,dy:0};
                saveCoverState();
            } else if (_coverTool === 'select') {
                _selectMarquee={start:p,end:p}; _selectedStickerIdx=-1; renderStickerLayer();
            }
            renderStickerLayer(); return;
        }
        if (_coverTool === 'bucket') { floodFill(Math.round(p.x),Math.round(p.y)); return; }
        if (_coverTool === 'eyedropper') { eyedropAt(Math.round(p.x),Math.round(p.y)); return; }
        if (_coverTool === 'text') { _pendingTextPos=p; openCoverTextModal(); return; }
        if (_coverTool==='line'||_coverTool==='circle'||_coverTool==='rect') { _coverShapeStart=p; _coverDrawing=true; return; }
        _coverDrawing=true; _lastDrawPoint=p;
    };
    const moveDraw = (cx, cy) => {
        if (_panStart) { _coverPanX=_panStart.panX+(cx-_panStart.px); _coverPanY=_panStart.panY+(cy-_panStart.py); applyTransform(); return; }
        if (_coverTool==='select'&&_selectMarquee) { _selectMarquee.end=getPos(cx,cy); drawMarquee(_selectMarquee); return; }
        if ((_coverTool==='sticker'||_coverTool==='select')&&_stickerDragMode&&_selectedStickerIdx>=0) {
            const p=getPos(cx,cy); const s=_coverStickers[_selectedStickerIdx];
            if (_stickerDragMode==='move') { s.x=p.x-_stickerDragOffset.dx; s.y=p.y-_stickerDragOffset.dy; }
            else if (_stickerDragMode==='resize') { const nd=Math.hypot(p.x-s.x,p.y-s.y); s.size=Math.max(20,Math.min(3000,_stickerDragOffset.startSize*(nd/Math.max(1,_stickerDragOffset.startDist)))); }

function eyedropAt(x,y) {

    let r=255,g=255,b=255,found=false;

/* ── 히스토리 ── */
function _composeHistorySnapshot(){
    // 베이스+탑(=모든 붓/도형 획)을 합성해 저장하고, 스티커/글자/이미지는 배열로 함께 보관.
    // (과거: 탑만 저장 → bakeTopToBase로 베이스에 구운 획이 히스토리에 없어 undo 시 영구 삭제됐음)
    var tmp=document.createElement('canvas');tmp.width=_coverCanvas.width;tmp.height=_coverCanvas.height;
    var tc=tmp.getContext('2d');
    if(_coverBase)tc.drawImage(_coverBase,0,0);
    tc.drawImage(_coverCanvas,0,0);
    return { img:tmp.toDataURL('image/png'), stickers:JSON.parse(JSON.stringify(_coverStickers||[])) };
}
function saveCoverState(){
    if(!_coverCanvas)return;
    _coverHistory=_coverHistory.slice(0,_coverHistIdx+1);
    _coverHistory.push(_composeHistorySnapshot());
    if(_coverHistory.length>15)_coverHistory.shift(); // 30→15: 저사양 태블릿 메모리 절감(toDataURL 누적→탭 튕김 방지)
    _coverHistIdx=_coverHistory.length-1;
    // 드래프트 자동저장 — 디바운스. (과거: 매 획마다 toDataURL+localStorage → CPU/메모리/쿼터 폭증으로
    //   태블릿 탭 튕김 + 쿼터초과 시 setItem이 조용히 실패해 복원 불가 → "그리는 중 그림 날아감")
    _scheduleBingoDraftSave();
}
// ── 드래프트 저장: 디바운스 + 쿼터 복원력 ──
//   localStorage는 부모(이벤트 상점) 앱과 origin을 공유해 쉽게 꽉 참 → setItem 실패 시 오래된 다른 드래프트 정리 후 재시도.
var _bingoDraftTimer=null;
function _scheduleBingoDraftSave(){
    if(!_bingoDraftKey) return;
    if(_bingoDraftTimer) clearTimeout(_bingoDraftTimer);
    _bingoDraftTimer=setTimeout(function(){ _bingoDraftTimer=null; _writeBingoDraft(); }, 700);
}
function _flushBingoDraftSave(){ if(_bingoDraftTimer){ clearTimeout(_bingoDraftTimer); _bingoDraftTimer=null; _writeBingoDraft(); } }
function _writeBingoDraft(){
    if(!_bingoDraftKey||!_coverCanvas) return;
    // 빈 캔버스면 저장하지 않고 기존 드래프트도 제거.
    //  (getCoverDataUrl은 흰 배경 JPEG라 빈 상태를 저장하면 복원 시 흰 이미지가 실려
    //   isCoverBlank이 false로 뒤집혀 "그림 먼저 그려주세요" 가드가 뚫림)
    //  ⚠️ isCoverBlank은 getImageData를 쓰므로 tainted 캔버스에서 throw 가능 → 반드시 try로 감싸
    //     예외가 드래프트 저장/인터벌/flush 전체를 깨뜨리지 않게 함.
    var _blank=false;
    try{ _blank=(typeof isCoverBlank==='function')&&isCoverBlank(); }catch(_){ _blank=false; }
    if(_blank){
        try{ localStorage.removeItem(_bingoDraftKey); }catch(_){}
        return;
    }
    var url='';
    try{
        // 스티커/글자/이미지까지 모두 포함한 최종 합성본으로 저장(JPEG).
        // (과거: 베이스+탑만 저장 → 튕김 복원 시 스티커/글자/삽입이미지 소실. JPEG라 용량도 절감돼 쿼터 여유↑)
        url=getCoverDataUrl();
    }catch(e){ return; }
    if(!url) return;
    try{
        localStorage.setItem(_bingoDraftKey, url);
    }catch(e){
        // 쿼터 초과 — 다른(오래된) 빙고 드래프트 정리 후 1회 재시도
        try{
            for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i); if(k && k.indexOf('bingoDraft_')===0 && k!==_bingoDraftKey) localStorage.removeItem(k); }
            localStorage.setItem(_bingoDraftKey, url);
        }catch(e2){}
    }
}
// 백그라운드 전환/닫기 직전 대기 중 저장 flush (튕김·이탈 시 최신 상태 보존)
window.addEventListener('pagehide', _flushBingoDraftSave);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') _flushBingoDraftSave(); });
// 한 획을 오래 긋는 도중 튕기면 그 획이 유실됨(드래프트는 획 끝에만 예약). 획은 탑 캔버스에
//   실시간으로 그려지므로, 그리는 중에는 주기적으로 드래프트를 저장해 mid-stroke 크래시에 대비.
setInterval(function(){ if(_coverDrawing && _bingoDraftKey) _writeBingoDraft(); }, 4000);
function _restoreFromHistory(){
    const snap=_coverHistory[_coverHistIdx];if(!snap)return;
    // 구버전(문자열) 호환 + 신버전({img,stickers}) 지원
    const url=(typeof snap==='string')?snap:(snap.img||'');
    const stk=(typeof snap==='string')?[]:(snap.stickers||[]);

    const img=new Image();
    img.onload=()=>{clearCoverNoSave();if(_coverBaseCtx)_coverBaseCtx.drawImage(img,0,0);renderStickerLayer();};
    img.src=url;

function redoCover(){if(_coverHistIdx<_coverHistory.length-1){_coverHistIdx++;_restoreFromHistory();}}
function clearCoverNoSave(){if(!_coverCtx)return;_coverCtx.clearRect(0,0,_coverCanvas.width,_coverCanvas.height);if(_coverBaseCtx)_coverBaseCtx.clearRect(0,0,_coverBase.width,_coverBase.height);}

function hexToRgb(hex){const h=hex.replace('#','');const v=h.length===3?h.split('').map(c=>c+c).join(''):h;return{r:parseInt(v.slice(0,2),16),g:parseInt(v.slice(2,4),16),b:parseInt(v.slice(4,6),16)};}
function isCoverBlank(){if(!_coverCanvas||!_coverCtx)return true;if(_coverStickers&&_coverStickers.length)return false;const d=_coverCtx.getImageData(0,0,_coverCanvas.width,_coverCanvas.height).data;for(let i=3;i<d.length;i+=4)if(d[i]>5)return false;if(_coverBaseCtx){const d2=_coverBaseCtx.getImageData(0,0,_coverBase.width,_coverBase.height).data;for(let i=3;i<d2.length;i+=4)if(d2[i]>5)return false;}return true;}
function getCoverDataUrl(){if(!_coverCanvas)return'';const tmp=document.createElement('canvas');tmp.width=_coverCanvas.width;tmp.height=_coverCanvas.height;const tctx=tmp.getContext('2d');tctx.fillStyle='white';tctx.fillRect(0,0,tmp.width,tmp.height);if(_coverBase)tctx.drawImage(_coverBase,0,0);_coverStickers.forEach(s=>{if(s.type==='image'){const w=s.size,h=s.size/(s.aspect||1);const img=_imageCache[s.src];if(img&&img.complete){tctx.save();tctx.translate(s.x,s.y);if(s.rotation)tctx.rotate(s.rotation);tctx.drawImage(img,-w/2,-h/2,w,h);tctx.restore();}}else if(s.type==='text'){tctx.save();tctx.translate(s.x,s.y);if(s.rotation)tctx.rotate(s.rotation);tctx.font=`${s.size}px '${s.font||'Dongle'}',sans-serif`;tctx.textAlign='center';tctx.textBaseline='middle';const lines=String(s.text).split('\n'),lh=s.size*1.1,startY=-(lines.length-1)*lh/2;if(s.bg){let mw=0;lines.forEach(ln=>{mw=Math.max(mw,tctx.measureText(ln).width);});tctx.fillStyle=s.bg;tctx.fillRect(-mw/2-s.size*.2,startY-lh/2-s.size*.1,mw+s.size*.4,lines.length*lh+s.size*.2);}if(s.shadow){tctx.fillStyle=s.shadow;lines.forEach((ln,i)=>tctx.fillText(ln,2,startY+i*lh+2));}tctx.fillStyle=s.color||'#333';lines.forEach((ln,i)=>tctx.fillText(ln,0,startY+i*lh));tctx.restore();}else{tctx.save();tctx.translate(s.x,s.y);if(s.rotation)tctx.rotate(s.rotation);tctx.font=`${s.size}px serif`;tctx.textAlign='center';tctx.textBaseline='middle';tctx.fillText(s.emoji,0,0);tctx.restore();}});if(_coverCanvas)tctx.drawImage(_coverCanvas,0,0);return tmp.toDataURL('image/jpeg',0.88);}

/* ── 제출 / 취소 ── */
function doSubmit(){
    if(isCoverBlank()){
        // 빈 캔버스 알림 모달
        const m=document.createElement('div');
        m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;';
        m.innerHTML=`<div style="background:white;border-radius:22px;padding:28px 24px;width:min(320px,100%);text-align:center;font-family:'Jua';box-shadow:0 8px 32px rgba(0,0,0,0.2);">
            <div style="font-size:42px;margin-bottom:10px;">🎨</div>
            <div style="font-size:17px;font-weight:bold;color:#333;margin-bottom:20px;">그림을 먼저 그려주세요!</div>
            <button onclick="this.closest('[data-blank-modal]').remove()" style="padding:10px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#7F77DD,#D4537E);color:white;font-family:'Jua';font-size:15px;font-weight:bold;cursor:pointer;">확인</button>
        </div>`;
        m.setAttribute('data-blank-modal','1');
        document.body.appendChild(m);
        m.addEventListener('click',e=>{if(e.target===m)m.remove();});
        return;
    }
    // 제출 확인 모달
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML=`<div style="background:white;border-radius:22px;padding:28px 24px;width:min(320px,100%);text-align:center;font-family:'Jua';box-shadow:0 8px 32px rgba(0,0,0,0.2);">
        <div style="font-size:42px;margin-bottom:10px;">📤</div>
        <div style="font-size:18px;font-weight:bold;color:#333;margin-bottom:6px;">제출할까요?</div>
        <div style="font-size:13px;color:#999;margin-bottom:22px;">선생님께 그림을 보냅니다</div>
        <div style="display:flex;gap:10px;">
            <button id="_submitCancelBtn" style="flex:1;padding:12px;border:none;border-radius:12px;background:#F5F5F5;color:#666;font-family:'Jua';font-size:15px;font-weight:bold;cursor:pointer;">취소</button>
            <button id="_submitOkBtn" style="flex:2;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#7F77DD,#D4537E);color:white;font-family:'Jua';font-size:15px;font-weight:bold;cursor:pointer;">📤 제출하기</button>
        </div>
    </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
    modal.querySelector('#_submitCancelBtn').onclick=()=>modal.remove();
    modal.querySelector('#_submitOkBtn').onclick=()=>{
        modal.remove();
        const btn=document.getElementById('btnSubmit');btn.textContent='⏳ 처리 중...';btn.disabled=true;
        try{
            const dataUrl=getCoverDataUrl();
            // ⚠️ 드래프트는 여기서 지우지 않는다 — 부모가 Cloudinary 업로드 성공(bingoDrawSaved)을
            //    ack로 알려줄 때까지 보존해야 업로드 실패 시 그림이 소실되지 않는다.
            window.parent.postMessage({type:'bingoDrawDone',dataUrl,note:''},'*');
        }catch(e){btn.textContent='📤';btn.disabled=false;alert('오류: '+e.message);}
    };
}
function doCancel(){window.parent.postMessage({type:'bingoDrawCancel'},'*');}

/* ── postMessage ── */
window.addEventListener('message',e=>{
    if(e.data?.type==='bingoDrawSaved'){
        // 부모가 업로드+제출 확정 완료 → 이제서야 드래프트 삭제(재현 방지)
        if(_bingoDraftKey){try{localStorage.removeItem(_bingoDraftKey);}catch(_){} _bingoDraftKey=null;}
        if(_bingoDraftTimer){clearTimeout(_bingoDraftTimer);_bingoDraftTimer=null;}
        return;
    }
    if(e.data?.type==='bingoDrawError'){
        // 업로드 실패 → 버튼 재활성화, 드래프트는 그대로 유지해 재제출/복원 가능
        const btn=document.getElementById('btnSubmit');
        if(btn){btn.textContent='📤';btn.disabled=false;}
        return;
    }
    if(e.data?.type==='bingoDrawInit'){
        const label=e.data.cellLabel||'';
        document.getElementById('titleBar').textContent=label?`🎨 ${label} — 그림 그리기`:'🎨 그림 그리기';
        clearCoverNoSave();_coverStickers=[];_selectedStickerIdx=-1;_coverHistory=[];_coverHistIdx=-1;
        // 드래프트 키 설정
        const cd=e.data.cd||'';const ci=e.data.ci!=null?String(e.data.ci):'';const sid=e.data.sid||'';
        // sid를 포함해 드래프트 키를 격리 — clearBingo 후 새 빙고 시작 시 이전 드래프트 무시
        _bingoDraftKey=(cd&&ci!=='')?`bingoDraft_${cd}_${ci}${sid?'_'+sid:''}`:null;
        const prevImg=e.data.prevImg||'';
        // 복원 우선순위: 로컬 드래프트(=최신 진행분) → 거절 이미지(prevImg).
        //  첫 제출 성공 시 드래프트는 ack로 삭제되므로, 재접속 때 드래프트가 남아있다는 건
        //  "거절 후 다시 그리던 진행분"이라 반드시 최우선이어야 함(과거: prevImg 우선 → 재그리기 유실).
        const draftImg=_bingoDraftKey?(() => { try { return localStorage.getItem(_bingoDraftKey)||''; } catch(e){return '';} })():'';
        const imgToLoad=draftImg||prevImg;
        if(imgToLoad){
            const img=new Image();img.crossOrigin='anonymous';
            img.onload=()=>{
                if(_coverBaseCtx){_coverBaseCtx.drawImage(img,0,0,_coverBase.width,_coverBase.height);}
                else if(_coverCtx){_coverCtx.drawImage(img,0,0,_coverCanvas.width,_coverCanvas.height);}
                renderStickerLayer();saveCoverState();
            };
            img.src=imgToLoad;
        } else {
            renderStickerLayer();saveCoverState();
        }
    }
});

/* ── 키보드 ── */
document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='z'){e.preventDefault();undoCover();}
    if((e.ctrlKey||e.metaKey)&&(e.shiftKey&&e.key==='Z'||e.key==='y')){e.preventDefault();redoCover();}
});

window.addEventListener('load',initCoverCanvas);
</script>
